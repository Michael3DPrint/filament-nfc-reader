                    Content-Type: application/json
                  json: !lambda |-
                    root["${assign_id_field}"] = id(found_spool_id);
                    root["printer_id"] = ${printer_id};
                    root["ams_id"] = 0;
                    root["tray_id"] = id(selected_slot) - 1;
                    root["move"] = true;
                  capture_response: true
                  max_response_buffer_size: 4096
                  on_response:
                    then:
                      - lambda: |-
                          int code = response->status_code;
                          std::string msg;
                          if (code >= 200 && code < 300) {
                            msg = "Assigned to slot " + std::to_string(id(selected_slot));
                          } else {
                            msg = "Assign failed: HTTP " + std::to_string(code);
                            ESP_LOGW("assign", "HTTP %d: %s", code, body.c_str());
                          }
                          id(selected_slot) = 0;
                          id(show_result).execute(msg.c_str());
                  on_error:
                    then:
                      - lambda: 'id(selected_slot) = 0;'
                      - script.execute:
                          id: show_result
                          msg: "Assign failed: no connection to Bambuddy"
            widgets:
              - label:
                  text: "Confirm"
                  text_font: montserrat_24
                  text_color: 0xFFFFFF
                  align: CENTER
        - button:
            x: 248
            y: 232
            width: 196
            height: 64
            radius: 14
            bg_color: 0x30363D
            border_width: 0
            shadow_width: 0
            on_short_click:
              - lambda: 'id(selected_slot) = 0;'
              - lvgl.page.show: main_page
            widgets:
              - label:
                  text: "Cancel"
                  text_font: montserrat_24
                  text_color: 0xFFFFFF
                  align: CENTER

    # Page 4: result of a lookup or an assignment.
    - id: result_page
      widgets:
        - label:
            id: result_text
            text: ""
            text_font: montserrat_24
            text_color: 0xE6EDF3
            text_align: CENTER
            align: CENTER
            y: -30
        - button:
            x: 150
            y: 232
            width: 180
            height: 64
            radius: 14
            bg_color: 0x2F81F7
            border_width: 0
            shadow_width: 0
            on_short_click:
              - lambda: 'id(selected_slot) = 0;'
              - lvgl.page.show: main_page
              - script.execute: poll_status
            widgets:
              - label:
                  text: "OK"
                  text_font: montserrat_24
                  text_color: 0xFFFFFF
                  align: CENTER

logger:

api:
