<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="572" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2328">Filament Selector wiring (I2C)</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#57606a">Four wires from the display board's I2C socket (P4) to the PN532</text>

  <!-- Display board -->
  <rect x="40" y="90" width="300" height="266" rx="12" fill="#eef4ff" stroke="#2f5fb3" stroke-width="2"/>
  <text x="190" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2328">ES3C40P display board</text>
  <text x="190" y="140" text-anchor="middle" font-size="12" fill="#57606a">4.0" ESP32-S3, 320x480 IPS, capacitive touch</text>
  <text x="190" y="158" text-anchor="middle" font-size="12" fill="#57606a">16 MB flash, 8 MB PSRAM</text>

  <rect x="60" y="180" width="260" height="158" rx="8" fill="#ffffff" stroke="#2f5fb3" stroke-width="1.5"/>
  <text x="190" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5fb3">I2C socket P4 (1.25 mm, 4 pin)</text>

  <g font-size="13" fill="#1f2328">
    <circle cx="300" cy="216" r="6" fill="#d1242f"/><text x="80" y="221">1  3V3</text>
    <circle cx="300" cy="248" r="6" fill="#1f2328"/><text x="80" y="253">2  GND</text>
    <circle cx="300" cy="280" r="6" fill="#bf8700"/><text x="80" y="285">3  SCL  (GPIO15)</text>
    <circle cx="300" cy="312" r="6" fill="#1a7f37"/><text x="80" y="317">4  SDA  (GPIO16)</text>
  </g>

  <!-- PN532 -->
  <rect x="560" y="90" width="300" height="266" rx="12" fill="#f3f9f0" stroke="#2c7a3f" stroke-width="2"/>
  <text x="710" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2328">PN532 NFC module V3</text>
  <text x="710" y="140" text-anchor="middle" font-size="12" fill="#57606a">Set to I2C mode</text>
  <rect x="580" y="156" width="260" height="24" rx="6" fill="#ffffff" stroke="#2c7a3f" stroke-width="1"/>
  <text x="710" y="173" text-anchor="middle" font-size="12" fill="#1f2328">Mode switches: 1 = ON, 2 = OFF</text>

  <rect x="580" y="196" width="260" height="142" rx="8" fill="#ffffff" stroke="#2c7a3f" stroke-width="1.5"/>
  <g font-size="13" fill="#1f2328">
    <circle cx="600" cy="216" r="6" fill="#d1242f"/><text x="620" y="221">VCC</text>
    <circle cx="600" cy="248" r="6" fill="#1a7f37"/><text x="620" y="253">SDA</text>
    <circle cx="600" cy="280" r="6" fill="#bf8700"/><text x="620" y="285">SCL</text>
    <circle cx="600" cy="312" r="6" fill="#1f2328"/><text x="620" y="317">GND</text>
  </g>

  <!-- Wires -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M306 216 C 430 216, 470 216, 594 216" stroke="#d1242f"/>
    <path d="M306 248 C 430 248, 470 312, 594 312" stroke="#1f2328"/>
    <path d="M306 280 C 430 280, 470 280, 594 280" stroke="#bf8700"/>
    <path d="M306 312 C 430 312, 470 248, 594 248" stroke="#1a7f37"/>
  </g>
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="450" y="206">3.3 V power</text>
      </g>

  <!-- Notes -->
  <rect x="40" y="374" width="820" height="72" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.2"/>
  <text x="56" y="396" font-size="13" font-weight="bold" fill="#1f2328">Pin order</text>
  <text x="56" y="416" font-size="12" fill="#1f2328">Socket pins 1 to 4 are 3V3, GND, SCL, SDA (vendor schematic, socket P4); find pin 1 there. Wire colors are only for reading this diagram.</text>
  <text x="56" y="434" font-size="12" fill="#1f2328">PN532 order (VCC, SDA, SCL, GND) is from the author's drawing; go by your module's labels.</text>

  <!-- Shared bus + internal pins -->
  <rect x="40" y="468" width="400" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="56" y="490" font-size="13" font-weight="bold" fill="#1f2328">Shared I2C bus (GPIO16 / GPIO15)</text>
  <text x="56" y="510" font-size="12" fill="#1f2328">PN532 reader at 0x24</text>
  <text x="56" y="528" font-size="12" fill="#1f2328">Touch controller at 0x38 (already on the board)</text>
  <text x="56" y="546" font-size="12" fill="#57606a">Both devices must use SDA = GPIO16, SCL = GPIO15</text>

  <rect x="460" y="468" width="400" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="476" y="490" font-size="13" font-weight="bold" fill="#1f2328">On the board already (no wiring)</text>
  <text x="476" y="510" font-size="12" fill="#1f2328">Display SPI: CS 10, DC 46, MOSI 11, CLK 12, MISO 13</text>
  <text x="476" y="528" font-size="12" fill="#1f2328">Backlight: GPIO45    Touch: INT 17, RST 18</text>
  <text x="476" y="546" font-size="12" fill="#57606a">Power the board over USB-C (5 V)</text>
</svg>
